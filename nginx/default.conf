server {
    listen 80;
    server_name _;
    set $external_host_port $http_host;

    if ($host = "localhost") {
        set $external_host_port "localhost:8080";
    }

    if ($host = "127.0.0.1") {
        set $external_host_port "127.0.0.1:8080";
    }

    location = /docs {
        return 301 /docs/;
    }

    location ^~ /docs/ {
        proxy_pass http://app:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $external_host_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $external_host_port;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location / {
        return 404;
    }
}
